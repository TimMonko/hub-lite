[project]
name = "hub-lite"
version = "0.1.0"
description = "Static site generator for the napari hub lite website"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "napari team" },
]
requires-python = ">=3.13"
dependencies = [
  "beautifulsoup4",
  "jinja2",
  "markdown-it-py[linkify,plugins]",
  # napari's logos, as napari itself uses them. Needs 1.1.0
  # (special_logo_path, the currentColor silhouette).
  "napari-resources",
  # napari's colours, code colours and icons (its static/brand/ folder),
  # without Sphinx: see dependency-overrides below. Needs the release
  # that adds brand/.
  "napari-sphinx-theme",
  "nh3",
  "packaging",
  "pagefind[extended]",
  "pygments",
  "requests",
]

[dependency-groups]
dev = [
  "mypy",
  "prek",
  "pytest",
  "types-requests",
]

[tool.uv]
package = false

[tool.pixi.workspace]
channels = ["conda-forge"]
name = "hub-lite"
platforms = ["win-64", "linux-64", "osx-arm64"]

# PROTOTYPE ONLY: both packages from local checkouts of unreleased branches
# (napari-resources: the currentColor silhouette; napari-sphinx-theme:
# brand/03). Once released, delete this table, pin the dependencies above
# (napari-resources>=1.1.0, napari-sphinx-theme>=<the brand release>), drop
# the napari-resources override below, and re-lock.
[tool.pixi.pypi-dependencies]
napari-resources = { path = "../napari-resources" }
napari-sphinx-theme = { path = "../napari-sphinx-theme-brand" }

[tool.pixi.pypi-options.dependency-overrides]
# The hub uses napari-sphinx-theme's brand files, not the Sphinx theme, so
# drop its Sphinx side: a marker that is never true removes the requirement
# (the lock's equivalent of `pip install --no-deps`). Importing the theme
# doesn't import Sphinx (it imports docutils for type hints only).
pydata-sphinx-theme = { version = ">=0", env-markers = "sys_platform == 'never'" }
# PROTOTYPE ONLY: the theme branch needs napari-resources>=1.1.0, which the
# local checkout isn't tagged as yet. Delete at release.
napari-resources = { path = "../napari-resources" }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest tests"
clean = "python build_site.py clean"
prep = "python build_site.py prep"
fetch-data = "python build_site.py fetch-data"
html = "python build_site.py html"
index-search = "python build_site.py index-search"
all = "python build_site.py all"
live = "python build_site.py live"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "S",  # flake8-bandit
]
ignore = [
  "E501",  # line too long
]
typing-modules = ["mypackage._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest uses assert
