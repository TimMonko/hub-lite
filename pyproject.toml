[project]
name = "hub-lite"
version = "0.1.0"
description = "Static site generator for the napari hub lite website"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "napari team" },
]
requires-python = ">=3.13"
dependencies = [
  "beautifulsoup4",
  "jinja2",
  "markdown-it-py[linkify,plugins]",
  # napari's logos, as napari itself uses them. Needs 1.1.0
  # (special_logo_path, the currentColor silhouette); see
  # tool.pixi.pypi-dependencies until it's released.
  "napari-resources",
  "nh3",
  "packaging",
  "pagefind[extended]",
  "pygments",
  "requests",
]

[dependency-groups]
dev = [
  "mypy",
  "prek",
  "pytest",
  "types-requests",
]

[tool.uv]
package = false

[tool.pixi.workspace]
channels = ["conda-forge"]
name = "hub-lite"
platforms = ["win-64", "linux-64", "osx-arm64"]

# PROTOTYPE ONLY: napari-resources from a local checkout of the branch that
# adds the currentColor silhouette. Once 1.1.0 is released, delete this
# table and make the dependency above "napari-resources>=1.1.0".
[tool.pixi.pypi-dependencies]
napari-resources = { path = "../napari-resources" }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest tests"
clean = "python build_site.py clean"
prep = "python build_site.py prep"
fetch-data = "python build_site.py fetch-data"
html = "python build_site.py html"
index-search = "python build_site.py index-search"
all = "python build_site.py all"
live = "python build_site.py live"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "S",  # flake8-bandit
]
ignore = [
  "E501",  # line too long
]
typing-modules = ["mypackage._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest uses assert
